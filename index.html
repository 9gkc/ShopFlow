<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A responsive product catalog with safe rendering, validated local cart state, and accessible quantity controls." />
    <meta name="theme-color" content="#0f172a" />
    <meta name="color-scheme" content="dark light" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="ShopFlow Product Catalog" />
    <meta property="og:description" content="A responsive product catalog with safe rendering, validated local cart state, and accessible quantity controls." />
    <meta name="twitter:card" content="summary" />

    <title>ShopFlow Product Catalog</title>
    <link rel="stylesheet" href="main.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap"
      rel="stylesheet" />
  </head>
  <body>
    <header>
      <h1>ShopFlow</h1>
      <p id="shop-status" class="shop-status" role="status" aria-live="polite">Loading the catalog…</p>
    </header>
    <main class="container">
      <nav aria-label="Product categories">
        <ul id="navbar"></ul>
      </nav>
      <div class="data">
        <section aria-labelledby="products-heading" class="products-section">
          <h2 id="products-heading">Products</h2>
          <div id="product-list" class="products" aria-busy="true"></div>
        </section>
        <aside id="cart" class="cart" aria-labelledby="cart-heading">
          <h2 id="cart-heading">Cart</h2>
          <ul id="cart-items" class="cart-items"></ul>
          <p class="total-amount">
            <span>Total</span>
            <span class="total-money" aria-live="polite"><span id="cart-total">$0.00</span></span>
          </p>
        </aside>
      </div>
    </main>
    <script src="main.js"></script>
  </body>
</html>
